services:
  portfolio:
    build:
      context: .
      args:
        NEXT_PUBLIC_WEB3FORMS_KEY: ${NEXT_PUBLIC_WEB3FORMS_KEY:-}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - portfolio-data:/app/data
    restart: unless-stopped
volumes:
  portfolio-data:
